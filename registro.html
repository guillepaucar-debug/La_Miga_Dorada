<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    updateProfile 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    doc, 
    setDoc 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Tus credenciales reales de Firebase
  const firebaseConfig = {
    apiKey: "TU_API_KEY_REAL",
    authDomain: "tu-proyecto.firebaseapp.com",
    projectId: "tu-proyecto",
    storageBucket: "tu-proyecto.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef"
  };

  // Inicializar Firebase, Auth y Firestore
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Escuchar el evento de envío del formulario
  document.addEventListener("DOMContentLoaded", () => {
    const registerForm = document.querySelector("form");

    if (!registerForm) return;

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      // Capturar los valores de los inputs
      const nameInput = registerForm.querySelector('input[type="text"]');
      const emailInput = registerForm.querySelector('input[type="email"]');
      const passwordInputs = registerForm.querySelectorAll('input[type="password"]');

      const name = nameInput ? nameInput.value.trim() : "";
      const email = emailInput ? emailInput.value.trim() : "";
      const password = passwordInputs[0] ? passwordInputs[0].value : "";
      const confirmPassword = passwordInputs[1] ? passwordInputs[1].value : "";

      // Validaciones básicas
      if (!name || !email || !password) {
        alert("Por favor, completa todos los campos.");
        return;
      }

      if (password !== confirmPassword) {
        alert("Las contraseñas no coinciden.");
        return;
      }

      if (password.length < 6) {
        alert("La contraseña debe tener al menos 6 caracteres.");
        return;
      }

      try {
        // 1. Crear el usuario en Firebase Authentication
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // 2. Actualizar el perfil con el Nombre Completo
        await updateProfile(user, { displayName: name });

        // 3. Guardar el usuario en la colección 'usuarios' de Firestore
        await setDoc(doc(db, "usuarios", user.uid), {
          uid: user.uid,
          nombre: name,
          email: email,
          fechaRegistro: new Date().toISOString(),
          rol: "cliente"
        });

        alert("¡Cuenta creada con éxito!");
        window.location.href = "index.html"; // Redireccionar al inicio

      } catch (error) {
        console.error("Error al registrar usuario:", error);
        if (error.code === "auth/email-already-in-use") {
          alert("El correo electrónico ya está registrado.");
        } else if (error.code === "auth/invalid-email") {
          alert("El correo electrónico no es válido.");
        } else {
          alert("Ocurrió un error al crear la cuenta: " + error.message);
        }
      }
    });
  });
</script>
