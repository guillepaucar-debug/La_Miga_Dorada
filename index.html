<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Miga Dorada - Panadería Boutique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                cream: "#FAF8F5",
                dark: "#2D211E",
                darkHover: "#382823",
                gold: "#C19B6C",
                goldLight: "#E8D2B5",
                muted: "#776E65",
                badgeBg: "#FFFFFF",
                cardBg: "#FFFFFF",
                footer: "#261B18",
                iconBg: "#FAF3EA",
              },
            },
            fontFamily: {
              serif: ["Playfair Display", "serif"],
              sans: ["Plus Jakarta Sans", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body class="bg-brand-cream text-brand-dark min-h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-brand-cream/95 backdrop-blur-md border-b border-brand-gold/15">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
        <a href="index.html" class="flex items-center space-x-3">
          <div class="w-11 h-11 rounded-full bg-brand-iconBg border border-brand-gold/30 flex items-center justify-center text-brand-gold font-serif font-bold text-xl">M</div>
          <span class="font-serif text-lg font-bold">La Miga Dorada</span>
        </a>

        <nav class="hidden md:flex items-center space-x-8 text-sm font-medium">
          <a href="index.html" class="text-brand-dark font-semibold">Inicio</a>
          <a href="login.html" class="text-brand-muted hover:text-brand-dark">Iniciar Sesión</a>
          <a href="registro.html" class="text-brand-muted hover:text-brand-dark">Crear Cuenta</a>
          <a href="checkout.html" class="text-brand-muted hover:text-brand-dark">Finalizar Compra</a>
        </nav>

        <div class="flex items-center space-x-4">
          <a href="carrito.html" class="flex items-center space-x-2 bg-brand-iconBg px-4 py-2 rounded-full border border-brand-gold/20">
            <i class="fa-solid fa-bag-shopping text-sm"></i>
            <span id="cart-count" class="text-xs font-bold bg-brand-dark text-white rounded-full w-5 h-5 flex items-center justify-center">0</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Hero -->
    <section class="relative w-full h-[360px] flex items-center overflow-hidden">
      <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&q=80&w=2000" class="absolute inset-0 w-full h-full object-cover filter brightness-90" />
      <div class="absolute inset-0 bg-black/50"></div>
      <div class="relative max-w-7xl mx-auto px-4 text-white">
        <h1 class="font-serif text-4xl sm:text-5xl">Nuestros Productos Artisanal</h1>
        <p class="text-sm mt-2 max-w-xl font-light">Repostería fina y panes artesanales recién horneados cada mañana.</p>
      </div>
    </section>

    <!-- Catalog -->
    <main class="max-w-7xl mx-auto px-4 py-10 w-full flex-grow">
      <div class="flex flex-col md:flex-row justify-between gap-4 mb-8">
        <div class="flex items-center space-x-2 overflow-x-auto pb-2" id="filter-tabs">
          <button class="filter-btn active bg-brand-dark text-white px-5 py-2 rounded-full text-sm font-medium" onclick="filterCategory('Todos', this)">Todos</button>
          <button class="filter-btn bg-white border border-gray-200 px-5 py-2 rounded-full text-sm font-medium" onclick="filterCategory('Tortas', this)">Tortas</button>
          <button class="filter-btn bg-white border border-gray-200 px-5 py-2 rounded-full text-sm font-medium" onclick="filterCategory('Panes de Molde', this)">Panes</button>
          <button class="filter-btn bg-white border border-gray-200 px-5 py-2 rounded-full text-sm font-medium" onclick="filterCategory('Panecillos', this)">Panecillos</button>
        </div>
        <div class="text-sm text-brand-muted">Mostrando <span id="visible-count" class="font-bold text-brand-dark">0</span> productos</div>
      </div>

      <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-brand-dark text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 transform translate-y-24 opacity-0 transition-all z-50">
      <i class="fa-solid fa-check text-brand-gold"></i>
      <span text-xs id="toast-title">Producto añadido al carrito</span>
    </div>

    <footer class="bg-brand-footer text-white py-6 text-center text-xs text-gray-400 mt-auto">
      <p>© 2026 La Miga Dorada. Todos los derechos reservados.</p>
    </footer>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "tu-proyecto.firebaseapp.com",
        projectId: "tu-proyecto",
        storageBucket: "tu-proyecto.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
      };

      let productsData = [
        { id: "1", title: "Tarta de Fresa & Crema", price: 24.50, category: "Tortas", image: "https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&q=80&w=600", tag: "Destacado", description: "Bizcocho esponjoso con fresas frescas de estación." },
        { id: "2", title: "Babka de Cacao & Avellanas", price: 18.00, category: "Panes de Molde", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&q=80&w=600", tag: "Bestseller", description: "Pan artesanal trenzado con rico chocolate oscuro." },
        { id: "3", title: "Croissant de Almendras", price: 6.50, category: "Panecillos", image: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&q=80&w=600", tag: "Clásico", description: "Hojaldre de mantequilla relleno de crema de almendras." }
      ];

      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      function updateCartCount() {
        const total = cart.reduce((acc, item) => acc + item.quantity, 0);
        document.getElementById("cart-count").textContent = total;
      }

      async function loadProducts() {
        try {
          const app = initializeApp(firebaseConfig);
          const db = getFirestore(app);
          const snapshot = await getDocs(collection(db, "productos"));
          if (!snapshot.empty) {
            productsData = [];
            snapshot.forEach(doc => productsData.push({ id: doc.id, ...doc.data() }));
          }
        } catch(e) {
          console.warn("Usando catálogo local de contingencia.");
        }
        renderProducts("Todos");
      }

      window.renderProducts = function(category) {
        const grid = document.getElementById("product-grid");
        grid.innerHTML = "";
        const list = category === "Todos" ? productsData : productsData.filter(p => p.category === category);
        document.getElementById("visible-count").textContent = list.length;

        list.forEach(p => {
          grid.innerHTML += `
            <div class="bg-white rounded-3xl overflow-hidden shadow-xs border border-gray-100 flex flex-col justify-between p-5">
              <img src="${p.image}" class="w-full h-48 object-cover rounded-2xl mb-4">
              <h3 class="font-serif font-semibold text-lg">${p.title}</h3>
              <p class="text-xs text-brand-muted mb-4">${p.description}</p>
              <div class="flex justify-between items-center">
                <span class="font-bold text-lg">S/ ${parseFloat(p.price).toFixed(2)}</span>
                <button onclick="addToCart('${p.id}')" class="bg-brand-dark text-white text-xs px-4 py-2 rounded-full hover:bg-brand-darkHover">Añadir</button>
              </div>
            </div>
          `;
        });
      }

      window.filterCategory = function(cat, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.className = "filter-btn bg-white border border-gray-200 px-5 py-2 rounded-full text-sm font-medium";
        });
        btn.className = "filter-btn active bg-brand-dark text-white px-5 py-2 rounded-full text-sm font-medium";
        renderProducts(cat);
      }

      window.addToCart = function(id) {
        const product = productsData.find(p => p.id === id);
        if (!product) return;
        const index = cart.findIndex(item => item.id === id);
        if (index > -1) {
          cart[index].quantity += 1;
        } else {
          cart.push({ ...product, quantity: 1 });
        }
        localStorage.setItem("cart", JSON.stringify(cart));
        updateCartCount();

        const toast = document.getElementById("toast");
        toast.classList.remove("translate-y-24", "opacity-0");
        setTimeout(() => toast.classList.add("translate-y-24", "opacity-0"), 2000);
      }

      document.addEventListener("DOMContentLoaded", () => {
        updateCartCount();
        loadProducts();
      });
    </script>
  </body>
</html>
