<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Carrito - La Miga Dorada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                cream: "#FAF8F5",
                dark: "#2D211E",
                darkHover: "#382823",
                gold: "#C19B6C",
                goldLight: "#E8D2B5",
                muted: "#776E65",
                badgeBg: "#FFFFFF",
                cardBg: "#FFFFFF",
                footer: "#261B18",
                iconBg: "#FAF3EA",
              },
            },
            fontFamily: {
              serif: ["Playfair Display", "serif"],
              sans: ["Plus Jakarta Sans", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="min-h-screen flex flex-col bg-brand-cream text-brand-dark">
    <!-- Header -->
    <header class="bg-white/95 backdrop-blur-md border-b border-brand-gold/15 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
        <a href="index.html" class="flex items-center space-x-3">
          <div class="w-11 h-11 rounded-full bg-brand-iconBg border border-brand-gold/30 flex items-center justify-center text-brand-gold font-serif font-bold text-xl">M</div>
          <div class="flex flex-col">
            <span class="font-serif font-bold">La Miga Dorada</span>
            <span class="text-[9px] text-brand-gold uppercase">PANADERÍA BOUTIQUE</span>
          </div>
        </a>
        <a href="index.html" class="hidden sm:flex items-center text-xs font-medium text-brand-muted hover:text-brand-dark transition-colors">
          <i class="fa-solid fa-arrow-left mr-2"></i> Volver a la tienda
        </a>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10 w-full flex-grow">
      <h1 class="font-serif text-4xl mb-8">Mi Carrito de Compras</h1>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Lista de Productos -->
        <div class="lg:col-span-2 space-y-4" id="cart-items-container">
          <!-- Carga Dinámica desde JS -->
        </div>

        <!-- Resumen del Pedido -->
        <div class="lg:col-span-1">
          <div class="bg-white rounded-2xl p-7 shadow-sm border border-gray-100 sticky top-28">
            <h2 class="font-serif text-xl border-b border-gray-100 pb-4 mb-4">Resumen de Compra</h2>
            <div class="space-y-3 text-xs border-b border-gray-100 pb-4">
              <div class="flex justify-between">
                <span class="text-gray-500">Subtotal</span>
                <span class="font-medium" id="cart-subtotal">S/ 0.00</span>
              </div>
              <div class="flex justify-between text-brand-gold">
                <span>Descuento</span>
                <span class="font-medium" id="cart-discount">-S/ 0.00</span>
              </div>
              <div class="flex justify-between">
                <span class="text-gray-500">Envío Estimado</span>
                <span class="font-medium" id="cart-shipping">S/ 5.50</span>
              </div>
            </div>

            <div class="mt-4 flex justify-between items-center mb-6">
              <span class="font-serif text-lg font-bold">Total</span>
              <span class="font-serif text-2xl font-bold text-brand-gold" id="cart-total">S/ 0.00</span>
            </div>

            <a href="checkout.html" class="block text-center w-full bg-brand-dark text-white rounded-xl py-3.5 font-medium text-sm hover:bg-brand-darkHover transition-colors">
              Proceder al Pago
            </a>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-brand-footer text-white py-6 text-center text-xs text-gray-400 mt-auto">
      <p>© 2026 La Miga Dorada. Todos los derechos reservados.</p>
    </footer>

    <script src="carrito.js"></script>
  </body>
</html>
