<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finalizar Compra - La Miga Dorada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                cream: "#FAF8F5",
                dark: "#2D211E",
                darkHover: "#382823",
                gold: "#C19B6C",
                goldLight: "#E8D2B5",
                muted: "#776E65",
                badgeBg: "#FFFFFF",
                cardBg: "#FFFFFF",
                footer: "#261B18",
                iconBg: "#FAF3EA",
              },
            },
            fontFamily: {
              serif: ["Playfair Display", "serif"],
              sans: ["Plus Jakarta Sans", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="min-h-screen flex flex-col text-brand-dark bg-brand-cream">
    <header class="bg-white/95 backdrop-blur-md border-b border-brand-gold/15 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
        <a href="index.html" class="flex items-center space-x-3">
          <div class="w-11 h-11 rounded-full bg-brand-iconBg border border-brand-gold/30 flex items-center justify-center text-brand-gold font-serif font-bold text-xl">M</div>
          <div class="flex flex-col">
            <span class="font-serif font-bold">La Miga Dorada</span>
            <span class="text-[9px] text-brand-gold uppercase">PANADERÍA BOUTIQUE</span>
          </div>
        </a>
        <a href="index.html" class="hidden sm:flex items-center text-xs font-medium text-brand-muted hover:text-brand-dark transition-colors">
          <i class="fa-solid fa-arrow-left mr-2"></i> Volver a la tienda
        </a>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10 w-full flex-grow">
      <h1 class="font-serif text-4xl mb-8">Finalizar Compra</h1>

      <form id="checkout-form" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Formularios -->
        <div class="lg:col-span-2 space-y-6">
          <!-- Datos de Envío -->
          <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100">
            <h3 class="font-serif text-xl text-brand-dark mb-6 flex items-center">
              <div class="w-8 h-8 rounded-full bg-brand-iconBg text-brand-gold flex items-center justify-center mr-3 text-sm">
                <i class="fa-solid fa-truck"></i>
              </div>
              1. Datos de Envío & Entrega
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 text-sm">
              <div>
                <label class="block text-xs font-semibold mb-1.5">Calle y Número</label>
                <input required type="text" placeholder="Ej: Av. Primavera 123" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-brand-gold" />
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1.5">Distrito / Zona</label>
                <input required type="text" placeholder="Ej: Miraflores" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-brand-gold" />
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1.5">Ciudad</label>
                <input required type="text" value="Lima" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-brand-gold" />
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1.5">Teléfono de Contacto</label>
                <input required type="tel" placeholder="987 654 321" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-brand-gold" />
              </div>
            </div>
          </div>

          <!-- Método de Pago -->
          <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100">
            <h3 class="font-serif text-xl text-brand-dark mb-6 flex items-center">
              <div class="w-8 h-8 rounded-full bg-brand-iconBg text-brand-gold flex items-center justify-center mr-3 text-sm">
                <i class="fa-solid fa-credit-card"></i>
              </div>
              2. Método de Pago Seguro
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-5 text-sm">
              <div class="md:col-span-4">
                <label class="block text-xs font-semibold mb-1.5">Nombre en la Tarjeta</label>
                <input required type="text" placeholder="Como figura en la tarjeta" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-brand-gold" />
              </div>
              <div class="md:col-span-2">
                <label class="block text-xs font-semibold mb-1.5">Número de Tarjeta</label>
                <input required type="text" maxlength="16" placeholder="0000 0000 0000 0000" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-brand-gold" />
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1.5">Vencimiento</label>
                <input required type="text" placeholder="MM/YY" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-brand-gold" />
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1.5">CVV</label>
                <input required type="password" maxlength="4" placeholder="123" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-brand-gold" />
              </div>
            </div>
          </div>
        </div>

        <!-- Pedido Resumen -->
        <div class="lg:col-span-1">
          <div class="bg-white rounded-2xl p-7 shadow-sm border border-gray-100 sticky top-28">
            <h2 class="font-serif text-xl border-b border-gray-100 pb-4 mb-4">Tu Pedido</h2>
            <div class="space-y-3 mb-6" id="order-summary-items"></div>

            <div class="space-y-3 text-xs border-t border-gray-100 pt-4">
              <div class="flex justify-between"><span class="text-gray-500">Subtotal</span><span id="chk-subtotal" class="font-medium">S/ 0.00</span></div>
              <div class="flex justify-between"><span class="text-gray-500">Envío a Domicilio</span><span id="chk-shipping" class="font-medium">S/ 5.50</span></div>
            </div>

            <div class="mt-4 pt-4 border-t border-gray-100 flex justify-between items-center mb-1">
              <span class="font-serif text-lg font-bold">Total Final</span>
              <span id="chk-total" class="font-serif text-2xl font-bold text-brand-gold">S/ 0.00</span>
            </div>

            <button type="submit" class="w-full bg-brand-dark text-white rounded-xl py-3.5 font-medium text-sm hover:bg-brand-darkHover transition-colors mt-4">
              Confirmar Pedido & Pagar
            </button>
          </div>
        </div>
      </form>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        const container = document.getElementById("order-summary-items");
        let subtotal = 0;

        if(cart.length === 0) {
          container.innerHTML = `<p class="text-xs text-brand-muted">No hay productos seleccionados.</p>`;
        } else {
          cart.forEach(item => {
            const price = typeof item.price === "number" ? item.price : parseFloat(item.price) || 0;
            subtotal += price * item.quantity;
            container.innerHTML += `
              <div class="flex justify-between text-xs">
                <span class="text-gray-600"><b>${item.quantity}x</b> ${item.title}</span>
                <span class="font-medium">S/ ${(price * item.quantity).toFixed(2)}</span>
              </div>
            `;
          });
        }

        const shipping = subtotal > 0 ? 5.50 : 0;
        document.getElementById("chk-subtotal").textContent = `S/ ${subtotal.toFixed(2)}`;
        document.getElementById("chk-shipping").textContent = `S/ ${shipping.toFixed(2)}`;
        document.getElementById("chk-total").textContent = `S/ ${(subtotal + shipping).toFixed(2)}`;

        document.getElementById("checkout-form").addEventListener("submit", (e) => {
          e.preventDefault();
          alert("¡Pedido realizado con éxito! Gracias por comprar en La Miga Dorada.");
          localStorage.removeItem("cart");
          window.location.href = "index.html";
        });
      });
    </script>
  </body>
</html>
